name: CI/CD Pipeline
on:
  push:
    branches: [main]
env:
  IMAGE_TAG: ${{ github.sha }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: ./Backend
      - run: npm run lint --if-present
        working-directory: ./Backend

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-task-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-task-backend:${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-task-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-task-frontend:${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-task-worker:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-task-worker:${{ github.sha }}

  update-infra:
    name: Update Infra Repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Rupeshgupta1/ai-task-platform-infra
          token: ${{ secrets.GH_PAT }}
          path: infra
      - run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - run: |
          yq e '.spec.template.spec.containers[0].image = "${{ secrets.DOCKER_USERNAME }}/ai-task-backend:${{ github.sha }}"' -i infra/k8s/backend.yaml
        
          yq e '.spec.template.spec.containers[0].image = "${{ secrets.DOCKER_USERNAME }}/ai-task-worker:${{ github.sha }}"' -i infra/k8s/worker.yaml
      - run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
