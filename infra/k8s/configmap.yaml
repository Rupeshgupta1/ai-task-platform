apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongodb-service:27017/ai-task-platform"
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_URL: "http://frontend-service:3000"
