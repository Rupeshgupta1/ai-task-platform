apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
data:
  MONGODB_URI: "mongodb://mongodb-service:27017/ai-task-platform"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_QUEUE_KEY: "task-queue-python"
  NODE_ENV: "production"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-task-platform
type: Opaque
stringData:
  JWT_SECRET: "change-this-in-production"
